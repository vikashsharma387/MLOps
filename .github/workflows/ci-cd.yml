name: MLOps Continuous Integration & Delivery (CI/CD)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  # =========================================================================
  # JOB 1: Code Linting, Automated Training, MLflow Tracking & Unit Testing
  # =========================================================================
  lint-test-and-train:
    name: 🧪 Lint, Test & Train ML Pipeline
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔍 Lint Code with Flake8
        run: |
          # Stop build on syntax errors or undefined names
          flake8 src/ app/ tests/ data/ --count --select=E9,F63,F7,F82 --show-source --statistics
          # Enforce code style with line length <= 120
          flake8 src/ app/ tests/ data/ --count --max-line-length=120 --statistics

      - name: 📊 Fetch Dataset & Run MLflow Training
        run: |
          python data/download_data.py
          PYTHONPATH=. python src/train.py

      - name: 🧪 Run Pytest Suite with Code Coverage
        run: |
          PYTHONPATH=. pytest tests/ -v --cov=src --cov=app --cov-report=term-missing --cov-report=xml

      - name: 📤 Upload Trained Model Artifact
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-model-artifact
          path: models/heart_model.pkl
          retention-days: 7

      - name: 📤 Upload MLflow Database Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-experiment-db
          path: mlflow.db
          retention-days: 7

  # =========================================================================
  # JOB 2: Docker Container Build & Smoke Testing
  # =========================================================================
  build-and-verify-container:
    name: 🐳 Docker Container Build & Smoke Test
    needs: lint-test-and-train
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4

      - name: 📥 Download Trained Model Artifact
        uses: actions/download-artifact@v4
        with:
          name: heart-disease-model-artifact
          path: models/

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image
        run: |
          docker build -t heart-disease-api:${{ github.sha }} .
          docker tag heart-disease-api:${{ github.sha }} heart-disease-api:latest

      - name: 🚀 Run Container & Verify Smoke Test
        run: |
          docker run -d -p 8000:8000 --name api-service heart-disease-api:${{ github.sha }}
          
          # Allow Uvicorn to boot up
          sleep 5

          # Verify Root Endpoint
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/ || exit 1

          # Verify Health Endpoint
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/health || exit 1

          # Verify Prometheus Metrics Endpoint
          curl --fail --retry 3 --retry-delay 2 http://localhost:8000/metrics || exit 1

          # Verify Prediction Endpoint (Positive Sample)
          curl -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{
              "age": 63, "sex": 1, "cp": 3, "trestbps": 145, "chol": 233,
              "fbs": 1, "restecg": 0, "thalach": 150, "exang": 0,
              "oldpeak": 2.3, "slope": 0, "ca": 0, "thal": 1
            }' || exit 1
