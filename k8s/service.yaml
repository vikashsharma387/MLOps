apiVersion: v1
kind: Service
metadata:
  name: heart-disease-api-service
  namespace: default
  labels:
    app: heart-disease-api
spec:
  type: NodePort # Use LoadBalancer on Cloud (AWS EKS / GCP GKE / Azure AKS)
  selector:
    app: heart-disease-api
  ports:
  - name: http
    port: 8000
    targetPort: 8000
    nodePort: 30080
    protocol: TCP
